# unbind default prefix and set it to ctrl-j
unbind C-b
set -g prefix C-j
bind C-j send-prefix

set -g history-limit 1000000
set -g status-keys emacs
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#T"
set -g mouse on
set -g focus-events on

# copy mode
setw -g mode-keys vi

# make delay shorter
set -sg escape-time 0

# pass through extended keys (e.g. Shift+Enter) to applications like Claude Code
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

### key bindings ###

# kill panel forcely
bind X kill-pane

# reload config file
bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded!"

# create new-window with current path
bind C new-window -c "#{pane_current_path}"

# split window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# resize panes
bind J resize-pane -D 10
bind K resize-pane -U 10
bind H resize-pane -L 10
bind L resize-pane -R 10

# select panes
bind j select-pane -D
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R

# change layout
bind = select-layout tiled

# toggle synchronize-panes (send input to all panes at once)
bind S setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}"

# popup window
bind m run-shell "zsh -c tmuxpopup"

# jump to any pane across sessions (splits included)
bind C-f display-popup -EE -w 80% -h 60% "zsh -c tmuxjump"

### status line
set -g status-position "top"

### source extra config file for Linux
if "uname | grep -q Linux" "source-file ~/.tmux.conf.linux"

### plugins  ###
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "fcsonline/tmux-thumbs"

# tpm
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# tmux-thumbs
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Claude Code attention markers: color a window's tab when one of its panes
# needs you.
#
# Red (permission) is judged by reading each pane's actual rendered screen
# (tmux-claude-watch, started below), not by a hook. Claude Code has no hook
# that fires when a permission prompt is *resolved* - only when it's shown
# (Notification/permission_prompt) and when the tool finishes
# (PostToolUse) - so a hook-only red flag stays lit for the whole duration
# of a long approved command, well after you've already acted. Reading the
# screen instead means red is always "is a prompt on screen right now",
# which is also how you'd check it yourself.
#
# Yellow (input) has no such gap - Stop/idle_prompt/agent_needs_input firmly
# bracket "turn ended" - so it stays hook-driven, via ~/.claude/tmux-claude-mark
# and hooks in ~/.claude/settings.json (outside this repo, so not tracked here):
#
#   "hooks": {
#     "Notification": [
#       { "matcher": "idle_prompt",       "hooks": [{ "type": "command", "command": "~/.claude/tmux-claude-mark input", "async": true }] },
#       { "matcher": "agent_needs_input", "hooks": [{ "type": "command", "command": "~/.claude/tmux-claude-mark input", "async": true }] }
#     ],
#     "Stop":             [{ "hooks": [{ "type": "command", "command": "~/.claude/tmux-claude-mark input", "async": true }] }],
#     "UserPromptSubmit": [{ "hooks": [{ "type": "command", "command": "~/.claude/tmux-claude-mark clear", "async": true }] }],
#     "PostToolUse":      [{ "hooks": [{ "type": "command", "command": "~/.claude/tmux-claude-mark clear", "async": true }] }],
#     "SessionEnd":       [{ "hooks": [{ "type": "command", "command": "~/.claude/tmux-claude-mark clear", "async": true }] }]
#   }
#
# @claude_prompt (screen-derived: permission/question/"") and @claude_status
# (hook-derived: input/"") are separate pane options on purpose, so the two
# sources never fight over the same value.
#
# Each pill variant gets its own option, since #{?...} can't contain a raw
# "," (nord-tmux's pill shape, byte-for-byte incl. its Powerline separator
# glyphs, just recolored).
set -g @claude_tab_default         "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#W #F #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g @claude_tab_default_current "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#W #F #[fg=cyan,bg=black,nobold,noitalics,nounderscore]"
set -g @claude_tab_red              "#[fg=black,bg=red,nobold,noitalics,nounderscore] #[fg=white,bg=red]#I #[fg=white,bg=red,nobold,noitalics,nounderscore] #[fg=white,bg=red]#W #F #[fg=red,bg=black,nobold,noitalics,nounderscore]"
set -g @claude_tab_yellow           "#[fg=black,bg=yellow,nobold,noitalics,nounderscore] #[fg=black,bg=yellow]#I #[fg=black,bg=yellow,nobold,noitalics,nounderscore] #[fg=black,bg=yellow]#W #F #[fg=yellow,bg=black,nobold,noitalics,nounderscore]"

set -g window-status-format "#{?#{m:*permission*,#{P:#{@claude_prompt}}},#{E:@claude_tab_red},#{?#{||:#{m:*question*,#{P:#{@claude_prompt}}},#{m:*input*,#{P:#{@claude_status}}}},#{E:@claude_tab_yellow},#{E:@claude_tab_default}}}"
set -g window-status-current-format "#{?#{m:*permission*,#{P:#{@claude_prompt}}},#{E:@claude_tab_red},#{?#{||:#{m:*question*,#{P:#{@claude_prompt}}},#{m:*input*,#{P:#{@claude_status}}}},#{E:@claude_tab_yellow},#{E:@claude_tab_default_current}}}"

# Screen-reading daemon for @claude_prompt (see comment block above).
run -b "~/.tmux/tmux-claude-watch"
