# Install to /etc/ssh/sshd_config.d/ on Linux servers (not used on macOS).
# Re-install it after rebuilding the root filesystem, since /etc is not
# carried over:
#   sudo install -m 644 -o root -g root 10-streamlocal.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t && sudo systemctl reload ssh

# For clipper (https://github.com/wincent/clipper) over SSH RemoteForward.
#
# sshd does not remove forwarded Unix domain sockets (e.g. ~/.clipper.sock)
# when a session ends, so the next RemoteForward fails to bind with
# "remote port forwarding failed for listen path". Let sshd unlink the
# stale socket before binding. Note that this only works on the server
# side; StreamLocalBindUnlink in ssh_config applies to LocalForward only.
StreamLocalBindUnlink yes

# Detect dead client connections so that stale sessions do not keep
# holding forwarded sockets after the network drops (e.g. laptop sleep).
ClientAliveInterval 60
ClientAliveCountMax 3
